[project]
name = "llm-tools-yt-transcript"
version = "0.2"
description = "Make YouTube transcripts available to llm"
readme = "README.md"
authors = [{name = "Rupert Lloyd"}]
license = "Apache-2.0"
classifiers = []
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "llm>=0.26",
    "mcp[cli]>=1.12.4",
    "requests>=2.32.4",
    "youtube-transcript-api>=1.1.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/rupello/llm-tools-yt-transcript"
Changelog = "https://github.com/rupello/llm-tools-yt-transcript/releases"
Issues = "https://github.com/rupello/llm-tools-yt-transcript/issues"
CI = "https://github.com/rupello/llm-tools-yt-transcript/actions"

[project.entry-points.llm]
llm_tools_yt_transcript = "llm_tools_yt_transcript"

[project.optional-dependencies]
test = ["pytest", "llm-echo>=0.3a1"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-v",
]
pythonpath = [
    "src",  # Add project root to Python path
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
testpaths = [
    "tests",
]

[project.scripts]
yt-transcript-mcp-server = "llm_tools_yt_transcript:mcp_main"